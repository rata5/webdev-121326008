<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labs · LabBookingBg</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="bar">
    <strong>LabBookingBg</strong>
    <span><span id="who" class="muted"></span> <button id="signout" type="button" class="secondary">Sign out</button></span>
  </header>
  <main>
    <h1>Labs</h1>
        <section class="card assistant" aria-labelledby="assistant-title">
      <h2 id="assistant-title">Find me a slot</h2>
      <form id="assistant-form">
        <label for="assistant-request">Describe when you need a lab</label>
        <input id="assistant-request" maxlength="300" required placeholder="20 seats on Thursday afternoon">
        <button id="assistant-go" type="submit">Find me a slot</button>
      </form>
      <div id="assistant-result" aria-live="polite"></div>
    </section>
    <div id="notice" aria-live="polite"></div>
    <section class="mine" aria-labelledby="mine-title">
      <h2 id="mine-title">My bookings</h2>
      <div id="mine"></div>
    </section>
    <div class="toolbar">
      <div>
        <label for="date">Date</label>
        <input id="date" type="date">
      </div>
      <p class="muted">Slots are one hour, 08:00–20:00, Monday to Friday.</p>
    </div>
    <div id="status" aria-live="polite"></div>
    <section id="labs" class="labs" aria-label="Labs and their slots"></section>
  </main>
  <script src="/assets/labs.js"></script>
</body>
</html>
